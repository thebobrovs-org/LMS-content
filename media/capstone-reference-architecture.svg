<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-label="Reference architecture for the Northwind Outdoor support agent, each element labelled with the requirement it serves.">
<rect width="820" height="560" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<g font-family="Inter, system-ui, sans-serif">
<text x="410.0" y="28" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Northwind Outdoor support agent: every box cites a requirement</text>
<rect x="20" y="60" width="170" height="96" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="32" y="80" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Customer, website</text>
<text x="32" y="100" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Signs in on the site</text>
<text x="32" y="117" font-size="12" font-weight="400" fill="#334155" text-anchor="start">App writes customer id</text>
<text x="32" y="134" font-size="12" font-weight="400" fill="#334155" text-anchor="start">into session state</text>
<text x="180" y="80" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R2</text>
<rect x="230" y="52" width="250" height="124" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="242" y="72" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">ADK LlmAgent</text>
<text x="242" y="92" font-size="12" font-weight="400" fill="#334155" text-anchor="start">On Agent Runtime (R6)</text>
<text x="242" y="109" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Persistent sessions</text>
<text x="242" y="126" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Own agent identity, narrow</text>
<text x="242" y="143" font-size="12" font-weight="400" fill="#334155" text-anchor="start">roles, PAB</text>
<text x="242" y="160" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Model: managed Gemini</text>
<text x="470" y="72" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R3, R5</text>
<rect x="520" y="52" width="280" height="70" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="532" y="72" font-size="13" font-weight="700" fill="#c2410c" text-anchor="start">Model Armor</text>
<text x="532" y="92" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Prompt injection screened; card</text>
<text x="532" y="109" font-size="12" font-weight="400" fill="#334155" text-anchor="start">numbers detected, de-identified (R4)</text>
<rect x="520" y="132" width="280" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9"/>
<text x="532" y="152" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start">Agent Registry</text>
<text x="790" y="152" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R7</text>
<text x="532" y="168" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Lists the agent and its MCP server</text>
<rect x="230" y="210" width="570" height="70" rx="8" fill="#f0fdf4" stroke="#15803d"/>
<text x="242" y="230" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Agent Gateway</text>
<text x="242" y="250" font-size="12" font-weight="400" fill="#334155" text-anchor="start">All outbound traffic: model, Agent Search, sessions, MCP server, payments API</text>
<text x="242" y="267" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Access policies allow only these targets; every call is recorded</text>
<text x="790" y="230" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R7</text>
<rect x="20" y="318" width="250" height="96" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="32" y="338" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Agent Search</text>
<text x="32" y="358" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Data store of 2,000 policy</text>
<text x="32" y="375" font-size="12" font-weight="400" fill="#334155" text-anchor="start">pages, synced weekly,</text>
<text x="32" y="392" font-size="12" font-weight="400" fill="#334155" text-anchor="start">superseded pages filtered</text>
<text x="260" y="338" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R1</text>
<rect x="285" y="318" width="250" height="96" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="297" y="338" font-size="13" font-weight="700" fill="#475569" text-anchor="start">MCP Toolbox, Cloud SQL</text>
<text x="297" y="358" font-size="12" font-weight="400" fill="#334155" text-anchor="start">get_orders_for_customer</text>
<text x="297" y="375" font-size="12" font-weight="400" fill="#334155" text-anchor="start">(parameterised; customer id</text>
<text x="297" y="392" font-size="12" font-weight="400" fill="#334155" text-anchor="start">from session state)</text>
<text x="525" y="338" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R2</text>
<rect x="550" y="318" width="250" height="96" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="562" y="338" font-size="13" font-weight="700" fill="#475569" text-anchor="start">issue_refund, payments API</text>
<text x="562" y="358" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Two-legged OAuth as the agent</text>
<text x="562" y="375" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Up to $200: refund</text>
<text x="562" y="392" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Over $200: approval queue</text>
<text x="790" y="338" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">R3</text>
<line x1="190" y1="108" x2="228" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="480" y1="86" x2="518" y2="86" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="355" y1="176" x2="355" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="250" y1="278" x2="150" y2="316" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="410" y1="278" x2="410" y2="316" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="675" y1="278" x2="675" y2="316" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="446" width="780" height="92" rx="8" fill="#fefce8" stroke="#a16207"/>
<text x="32" y="466" font-size="13" font-weight="700" fill="#a16207" text-anchor="start">Evaluation, designed in (R5)</text>
<text x="32" y="486" font-size="12" font-weight="400" fill="#334155" text-anchor="start">CI: evalset with expected tool calls (IN_ORDER: lookup before refund), edge and adversarial cases; a regression fails the build</text>
<text x="32" y="503" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Online: sampled live traffic scored with reference-free checks, plus latency, cost and errors</text>
<text x="32" y="520" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Every failure found online becomes a new eval case</text>
</g>
</svg>
