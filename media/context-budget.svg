<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" width="760" height="518" role="img" aria-label="Panel A: illustrative tokens per turn for a support agent, as stacked bars by component. Before any cut: instructions 3k, tool declarations 10k, history 18k, memory 6k, retrieved chunks 10k, total 47,000. Filtering tools to the ones the step needs cuts tool declarations to 2k, total 39,000. Compacting history cuts it to 4k, total 25,000. Recalling memory on demand cuts memory to about 1.5k, assuming compaction soon summarises each recall, total 20,500. Panel B: with context caching the turn is still 20,500 tokens; the stable 5k prefix of instructions and tool declarations is cached, so it costs less and is processed faster, but it still counts in the context window.">
<rect width="760" height="520" fill="#ffffff"/>
<g font-family="Inter, system-ui, sans-serif">
<text x="20" y="30" font-size="16" font-weight="600" fill="#0f172a">A. Tokens per turn by component (illustrative), after each cut</text>
<rect x="20" y="46" width="14" height="14" rx="2" fill="#4f46e5"/><text x="40" y="58" font-size="12" fill="#334155">Instructions</text>
<rect x="146" y="46" width="14" height="14" rx="2" fill="#0891b2"/><text x="166" y="58" font-size="12" fill="#334155">Tool declarations</text>
<rect x="307" y="46" width="14" height="14" rx="2" fill="#d97706"/><text x="327" y="58" font-size="12" fill="#334155">History</text>
<rect x="398" y="46" width="14" height="14" rx="2" fill="#16a34a"/><text x="418" y="58" font-size="12" fill="#334155">Memory</text>
<rect x="482" y="46" width="14" height="14" rx="2" fill="#be185d"/><text x="502" y="58" font-size="12" fill="#334155">Retrieved chunks</text>
<text x="190" y="105" text-anchor="end" font-size="12.5" fill="#0f172a">Before</text>
<rect x="200.0" y="84" width="30.0" height="32" fill="#4f46e5" stroke="#ffffff" stroke-width="1"/>
<rect x="230.0" y="84" width="100.0" height="32" fill="#0891b2" stroke="#ffffff" stroke-width="1"/>
<text x="280.0" y="105" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">10k</text>
<rect x="330.0" y="84" width="180.0" height="32" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
<text x="420.0" y="105" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">18k</text>
<rect x="510.0" y="84" width="60.0" height="32" fill="#16a34a" stroke="#ffffff" stroke-width="1"/>
<text x="540.0" y="105" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">6k</text>
<rect x="570.0" y="84" width="100.0" height="32" fill="#be185d" stroke="#ffffff" stroke-width="1"/>
<text x="620.0" y="105" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">10k</text>
<text x="678.0" y="105" font-size="12.5" font-weight="600" fill="#0f172a">47,000</text>
<text x="190" y="155" text-anchor="end" font-size="12.5" fill="#0f172a">Filter tools</text>
<rect x="200.0" y="134" width="30.0" height="32" fill="#4f46e5" stroke="#ffffff" stroke-width="1"/>
<rect x="230.0" y="134" width="20.0" height="32" fill="#0891b2" stroke="#ffffff" stroke-width="1"/>
<rect x="250.0" y="134" width="180.0" height="32" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
<text x="340.0" y="155" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">18k</text>
<rect x="430.0" y="134" width="60.0" height="32" fill="#16a34a" stroke="#ffffff" stroke-width="1"/>
<text x="460.0" y="155" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">6k</text>
<rect x="490.0" y="134" width="100.0" height="32" fill="#be185d" stroke="#ffffff" stroke-width="1"/>
<text x="540.0" y="155" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">10k</text>
<text x="598.0" y="155" font-size="12.5" font-weight="600" fill="#0f172a">39,000</text>
<text x="190" y="205" text-anchor="end" font-size="12.5" fill="#0f172a">Compact history</text>
<rect x="200.0" y="184" width="30.0" height="32" fill="#4f46e5" stroke="#ffffff" stroke-width="1"/>
<rect x="230.0" y="184" width="20.0" height="32" fill="#0891b2" stroke="#ffffff" stroke-width="1"/>
<rect x="250.0" y="184" width="40.0" height="32" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
<text x="270.0" y="205" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">4k</text>
<rect x="290.0" y="184" width="60.0" height="32" fill="#16a34a" stroke="#ffffff" stroke-width="1"/>
<text x="320.0" y="205" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">6k</text>
<rect x="350.0" y="184" width="100.0" height="32" fill="#be185d" stroke="#ffffff" stroke-width="1"/>
<text x="400.0" y="205" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">10k</text>
<text x="458.0" y="205" font-size="12.5" font-weight="600" fill="#0f172a">25,000</text>
<text x="190" y="255" text-anchor="end" font-size="12.5" fill="#0f172a">Recall memory on demand*</text>
<rect x="200.0" y="234" width="30.0" height="32" fill="#4f46e5" stroke="#ffffff" stroke-width="1"/>
<rect x="230.0" y="234" width="20.0" height="32" fill="#0891b2" stroke="#ffffff" stroke-width="1"/>
<rect x="250.0" y="234" width="40.0" height="32" fill="#d97706" stroke="#ffffff" stroke-width="1"/>
<text x="270.0" y="255" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">4k</text>
<rect x="290.0" y="234" width="15.0" height="32" fill="#16a34a" stroke="#ffffff" stroke-width="1"/>
<rect x="305.0" y="234" width="100.0" height="32" fill="#be185d" stroke="#ffffff" stroke-width="1"/>
<text x="355.0" y="255" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">10k</text>
<text x="413.0" y="255" font-size="12.5" font-weight="600" fill="#0f172a">20,500</text>
<text x="200" y="288" font-size="11.5" fill="#475569">Each row keeps the cuts above it. Retrieved chunks are a separate cut:</text>
<text x="200" y="304" font-size="11.5" fill="#475569">rerank and pass a smaller top-k (topic 3.4).</text>
<text x="200" y="320" font-size="11.5" fill="#475569">* Assumes compaction soon summarises each recalled result in history.</text>
<text x="20" y="358" font-size="16" font-weight="600" fill="#0f172a">B. Context caching: same context, cheaper repeated prefix</text>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#e0e7ff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#4f46e5" stroke-width="2.5"/></pattern></defs>
<text x="190" y="401" text-anchor="end" font-size="12.5" fill="#0f172a">Without caching</text>
<rect x="200" y="380" width="50.0" height="32" fill="#94a3b8" stroke="#ffffff"/>
<rect x="250.0" y="380" width="155.0" height="32" fill="#cbd5e1" stroke="#ffffff"/>
<text x="327.5" y="401" text-anchor="middle" font-size="11" fill="#0f172a">rest of the turn</text>
<text x="413.0" y="401" font-size="12.5" font-weight="600" fill="#0f172a">20,500</text>
<text x="190" y="447" text-anchor="end" font-size="12.5" fill="#0f172a">With caching</text>
<rect x="200" y="426" width="50.0" height="32" fill="url(#hatch)" stroke="#ffffff"/>
<rect x="250.0" y="426" width="155.0" height="32" fill="#cbd5e1" stroke="#ffffff"/>
<text x="327.5" y="447" text-anchor="middle" font-size="11" fill="#0f172a">rest of the turn</text>
<text x="413.0" y="447" font-size="12.5" font-weight="600" fill="#0f172a">20,500</text>
<text x="200" y="474" font-size="11.5" fill="#334155">The hatched block is the stable prefix (instructions and tool declarations, 5k).</text>
<text x="200" y="492" font-size="11.5" fill="#334155">Cached, it costs less and is processed faster, but it still counts in the context window.</text>
</g></svg>