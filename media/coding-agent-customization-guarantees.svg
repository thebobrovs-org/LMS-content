<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A table with one requirement, every edited TypeScript file passes the linter, tried with five mechanisms. Rule saying always run the linter: the model may skip it, so not guaranteed. Skill with a lint procedure: loads only if the task matches its description, so not guaranteed. Reviewer subagent: runs only when the agent delegates to it, so not guaranteed. Plugin: ships whichever mechanism it contains, so it guarantees only what that mechanism does. PostToolUse hook on edits: the harness runs it after every edit, so guaranteed. A footer says a hook covers one developer's machine and the agent's edit tools, so CI is still the final check before merge.">
  <rect width="760" height="400" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Requirement: every edited TypeScript file passes the linter</text>

    <g font-size="12" font-weight="600" fill="#475569">
      <text x="36" y="66">Mechanism</text>
      <text x="270" y="66">Why it does or does not hold</text>
      <text x="674" y="66" text-anchor="middle">Every edit?</text>
    </g>
    <line x1="20" y1="76" x2="740" y2="76" stroke="#cbd5e1"/>

    <!-- rows: y centres 104, 152, 200, 248, 296 -->
    <g font-size="12.5">
      <rect x="20" y="82" width="720" height="44" rx="8" fill="#f8fafc"/>
      <text x="36" y="101" font-weight="600" fill="#0f172a">Rule</text>
      <text x="36" y="117" font-size="11" fill="#475569">"Always run the linter"</text>
      <text x="270" y="109" fill="#334155">Guidance in context; the model may skip it</text>
      <rect x="616" y="92" width="116" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/>
      <text x="674" y="108" text-anchor="middle" font-size="11.5" fill="#78350f">Not guaranteed</text>

      <rect x="20" y="130" width="720" height="44" rx="8" fill="#ffffff"/>
      <text x="36" y="149" font-weight="600" fill="#0f172a">Skill</text>
      <text x="36" y="165" font-size="11" fill="#475569">Lint procedure</text>
      <text x="270" y="157" fill="#334155">Loads only if the task matches its description</text>
      <rect x="616" y="140" width="116" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/>
      <text x="674" y="156" text-anchor="middle" font-size="11.5" fill="#78350f">Not guaranteed</text>

      <rect x="20" y="178" width="720" height="44" rx="8" fill="#f8fafc"/>
      <text x="36" y="197" font-weight="600" fill="#0f172a">Subagent</text>
      <text x="36" y="213" font-size="11" fill="#475569">Reviewer that lints</text>
      <text x="270" y="205" fill="#334155">Runs only when the agent delegates to it</text>
      <rect x="616" y="188" width="116" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/>
      <text x="674" y="204" text-anchor="middle" font-size="11.5" fill="#78350f">Not guaranteed</text>

      <rect x="20" y="226" width="720" height="44" rx="8" fill="#ffffff"/>
      <text x="36" y="245" font-weight="600" fill="#0f172a">Plugin</text>
      <text x="36" y="261" font-size="11" fill="#475569">Package of the above</text>
      <text x="270" y="253" fill="#334155">Ships its contents; adds no guarantee of its own</text>
      <rect x="616" y="236" width="116" height="24" rx="12" fill="#f1f5f9" stroke="#64748b"/>
      <text x="674" y="252" text-anchor="middle" font-size="11.5" fill="#334155">As its contents</text>

      <rect x="20" y="274" width="720" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
      <text x="36" y="293" font-weight="600" fill="#14532d">Hook</text>
      <text x="36" y="309" font-size="11" fill="#166534">PostToolUse on edits</text>
      <text x="270" y="301" fill="#14532d">Run by the harness after every edit, not left to the model</text>
      <rect x="616" y="284" width="116" height="24" rx="12" fill="#16a34a"/>
      <text x="674" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Guaranteed</text>
    </g>

    <g font-size="11.5" fill="#334155">
      <text x="20" y="348">A hook enforces on one developer's machine, for the agent's edit tools. Hand edits, shell</text>
      <text x="20" y="366">rewrites and a disabled hook bypass it, so keep the same check in CI as the final gate.</text>
    </g>
  </g>
</svg>
