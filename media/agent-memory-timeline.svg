<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="One user across two sessions. Each session holds its own events and session state. State keys with the user prefix carry over to the user's next session. At the end of session 1, Memory Bank extracts facts from the conversation; at the start of session 2, the agent recalls the relevant ones.">
  <rect width="760" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">One user, two sessions, one memory</text>

    <!-- session 1 -->
    <rect x="20" y="48" width="330" height="214" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="36" y="72" font-size="14" font-weight="600" fill="#0f172a">Session 1 (Monday)</text>
    <text x="36" y="96" font-size="12" font-weight="600" fill="#1d4ed8">Events (the history)</text>
    <g font-size="11.5" fill="#334155">
      <text x="36" y="114">User: Order a desk lamp, ship to our Lyon office.</text>
      <text x="36" y="130">Agent calls create_order, gets order B-77.</text>
      <text x="36" y="146">User: And please reply in French from now on.</text>
    </g>
    <text x="36" y="174" font-size="12" font-weight="600" fill="#1d4ed8">State</text>
    <g font-size="11.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="36" y="194">order_id = "B-77"</text>
      <text x="36" y="212">user:language = "fr"</text>
      <text x="36" y="230">temp:api_raw = {...}</text>
    </g>
    <g font-size="10.5" fill="#475569">
      <text x="214" y="194">this session only</text>
      <text x="214" y="212">every session of this user</text>
      <text x="214" y="230">gone after the turn</text>
    </g>

    <!-- session 2 -->
    <rect x="410" y="48" width="330" height="214" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="426" y="72" font-size="14" font-weight="600" fill="#0f172a">Session 2 (Thursday)</text>
    <text x="426" y="96" font-size="12" font-weight="600" fill="#1d4ed8">Events (a new history)</text>
    <g font-size="11.5" fill="#334155">
      <text x="426" y="114">User: I need another lamp, same as before.</text>
      <text x="426" y="130">Agent recalls memories, replies in French,</text>
      <text x="426" y="146">offers to ship to the Lyon office.</text>
    </g>
    <text x="426" y="174" font-size="12" font-weight="600" fill="#1d4ed8">State</text>
    <g font-size="11.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="426" y="194">user:language = "fr"</text>
      <text x="426" y="212">(order_id is gone)</text>
    </g>
    <g font-size="10.5" fill="#475569">
      <text x="600" y="194">carried over</text>
      <text x="600" y="212">new session</text>
    </g>
    <line x1="352" y1="208" x2="406" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- memory bank -->
    <rect x="160" y="318" width="440" height="96" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="380" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Memory Bank (long-term memory for this user)</text>
    <g font-size="11.5" fill="#334155" text-anchor="middle">
      <text x="380" y="364">Facts an LLM extracted and consolidated, isolated per scope (agent and user):</text>
      <text x="380" y="384">"Ships work orders to the Lyon office." "Bought a desk lamp in November."</text>
      <text x="380" y="402">Kept until deleted or its time to live expires.</text>
    </g>
    <path d="M185 264 C185 290 200 300 230 316" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="40" y="296" font-size="11" fill="#475569">After a turn or session:</text>
    <text x="40" y="310" font-size="11" fill="#475569">generate memories</text>
    <path d="M530 316 C560 300 575 290 575 264" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="592" y="296" font-size="11" fill="#475569">Start of a turn:</text>
    <text x="592" y="310" font-size="11" fill="#475569">recall relevant memories</text>
  </g>
</svg>
