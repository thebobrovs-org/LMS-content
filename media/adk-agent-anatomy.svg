<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Anatomy of an ADK LlmAgent: identity, model and instruction configure it; tools are called and return results; sub-agents receive control by transfer; callbacks run before and after the agent, each model call and each tool call">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Anatomy of an ADK LlmAgent</text>

    <!-- the agent -->
    <rect x="236" y="56" width="288" height="196" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">LlmAgent</text>
    <g font-size="12" fill="#334155">
      <text x="252" y="108"><tspan font-weight="600" fill="#1d4ed8">name, description</tspan>: who it is; the</text>
      <text x="252" y="124">description is how other agents route to it</text>
      <text x="252" y="150"><tspan font-weight="600" fill="#1d4ed8">model</tspan>: the LLM that reasons</text>
      <text x="252" y="176"><tspan font-weight="600" fill="#1d4ed8">instruction</tspan>: goal, persona, limits,</text>
      <text x="252" y="192">when to use each tool</text>
      <text x="252" y="218"><tspan font-weight="600" fill="#1d4ed8">tools</tspan> and <tspan font-weight="600" fill="#1d4ed8">sub_agents</tspan> (right)</text>
      <text x="252" y="234"><tspan font-weight="600" fill="#1d4ed8">callbacks</tspan> (below)</text>
    </g>

    <!-- tools -->
    <rect x="578" y="56" width="172" height="92" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="664" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">tools</text>
    <g font-size="11" fill="#334155">
      <text x="588" y="98">Function tools (your code)</text>
      <text x="588" y="114">Built-in tools (e.g. Search)</text>
      <text x="588" y="130">AgentTool (an agent as a tool)</text>
    </g>
    <line x1="527" y1="92" x2="574" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <text x="551" y="84" text-anchor="middle" font-size="10.5" fill="#475569">call</text>
    <text x="551" y="108" text-anchor="middle" font-size="10.5" fill="#475569">result</text>

    <!-- sub agents -->
    <rect x="578" y="164" width="172" height="88" rx="12" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="664" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">sub_agents</text>
    <g font-size="11" fill="#334155">
      <text x="588" y="206">Specialist agents that take</text>
      <text x="588" y="222">over the conversation when</text>
      <text x="588" y="238">control is transferred</text>
    </g>
    <line x1="527" y1="208" x2="574" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="551" y="200" text-anchor="middle" font-size="10.5" fill="#475569">transfer</text>

    <!-- left: inputs -->
    <rect x="12" y="96" width="206" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Each model call reads</text>
    <g font-size="11.5" fill="#334155">
      <text x="24" y="140">The instruction</text>
      <text x="24" y="158">Tool and sub-agent declarations</text>
      <text x="24" y="176">The conversation so far and its state</text>
      <text x="24" y="194">The user's new message</text>
    </g>
    <line x1="219" y1="154" x2="233" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- callbacks band -->
    <rect x="20" y="282" width="720" height="98" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="380" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Callbacks: your deterministic code at fixed points in the loop</text>
    <g font-size="11.5" fill="#334155" text-anchor="middle">
      <text x="140" y="328"><tspan font-weight="600" fill="#92400e">before / after agent</tspan></text>
      <text x="140" y="346">skip the agent, or add to</text>
      <text x="140" y="362">its output</text>
      <text x="380" y="328"><tspan font-weight="600" fill="#92400e">before / after model</tspan></text>
      <text x="380" y="346">return a response to skip the call,</text>
      <text x="380" y="362">or replace the model's response</text>
      <text x="620" y="328"><tspan font-weight="600" fill="#92400e">before / after tool</tspan></text>
      <text x="620" y="346">return a result to skip the tool,</text>
      <text x="620" y="362">or replace the tool's result</text>
    </g>
    <line x1="380" y1="254" x2="380" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>
