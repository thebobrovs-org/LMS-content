<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="One agent tool call passing through Agent Gateway, with Agent Identity and Agent Registry around it.">
<rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<g font-family="Inter, system-ui, sans-serif">
<text x="380.0" y="28" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Who, may they now, and what exists</text>
<rect x="250" y="48" width="260" height="104" rx="8" fill="#f5f3ff" stroke="#6d28d9"/>
<text x="264" y="70" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start">Agent Registry: what exists?</text>
<text x="264" y="92" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Registered: invoice-agent</text>
<text x="264" y="110" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Registered: finance-mcp (MCP server)</text>
<text x="264" y="128" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Not listed: pdf-tools-online</text>
<rect x="24" y="190" width="190" height="110" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="38" y="214" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Invoice agent</text>
<text x="38" y="236" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="start">Agent Identity: who?</text>
<text x="38" y="256" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Its own principal (a</text>
<text x="38" y="274" font-size="12" font-weight="400" fill="#334155" text-anchor="start">SPIFFE-based identity)</text>
<rect x="262" y="180" width="244" height="200" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="276" y="204" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Agent Gateway: may they, now?</text>
<text x="276" y="228" font-size="12" font-weight="400" fill="#334155" text-anchor="start">1. Which agent is calling?</text>
<text x="276" y="250" font-size="12" font-weight="400" fill="#334155" text-anchor="start">2. Is the target registered, and</text>
<text x="292" y="272" font-size="12" font-weight="400" fill="#334155" text-anchor="start">does the policy allow this agent</text>
<text x="292" y="294" font-size="12" font-weight="400" fill="#334155" text-anchor="start">to call it?</text>
<text x="276" y="316" font-size="12" font-weight="400" fill="#334155" text-anchor="start">3. Screen the content (Model Armor)</text>
<text x="276" y="338" font-size="12" font-weight="400" fill="#334155" text-anchor="start">4. Record traces and access logs</text>
<rect x="546" y="190" width="190" height="60" rx="8" fill="#ecfdf5" stroke="#047857"/>
<text x="560" y="214" font-size="13" font-weight="700" fill="#065f46" text-anchor="start">finance-mcp</text>
<text x="560" y="234" font-size="12" font-weight="400" fill="#334155" text-anchor="start">registered, allowed</text>
<rect x="546" y="300" width="190" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
<text x="560" y="324" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start">pdf-tools-online</text>
<text x="560" y="344" font-size="12" font-weight="400" fill="#334155" text-anchor="start">not registered: refused</text>
<line x1="214" y1="245" x2="258" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="506" y1="220" x2="542" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="506" y1="330" x2="542" y2="330" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="524" y="322" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">✕</text>
<line x1="380" y1="152" x2="380" y2="176" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<text x="388" y="170" font-size="11" font-weight="400" fill="#6d28d9" text-anchor="start">policies name registry entries</text>
<text x="380.0" y="416" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Identity answers who is calling. The registry answers what exists.</text>
<text x="380.0" y="436" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">The gateway answers whether this call may happen now, and records it.</text>
</g></svg>
