<text x="34.0" y="96" font-size="12" fill="#475569">Runs as a service account</text>
<text x="34.0" y="113" font-size="12" fill="#475569">with broad roles in many projects</text>
<rect x="36.0" y="136" width="200" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
<text x="48.0" y="158" font-size="12" fill="#0f172a">Invoices bucket</text>
