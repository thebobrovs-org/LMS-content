<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-label="Blast radius of a hijacked agent under a shared service account, under its own identity with narrow roles, and with a Principal Access Boundary added.">
<rect width="760" height="490" fill="#ffffff"/>
<g font-family="Inter, system-ui, sans-serif">
<text x="380.0" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">What a hijacked invoice agent can reach</text>
<rect x="20.0" y="48" width="232" height="392" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
