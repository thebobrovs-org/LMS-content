<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="Sequence diagrams of two-legged and three-legged OAuth for an agent tool call.">
<rect width="760" height="640" fill="#ffffff"/>
<g font-family="Inter, system-ui, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<text x="24" y="40" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Two-legged (2LO): the agent acts as itself</text>
<rect x="28.0" y="52" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="90.0" y="72" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Agent's tool</text>
<line x1="90.0" y1="82" x2="90.0" y2="232" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="318.0" y="52" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="380.0" y="72" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Authorization server</text>
<line x1="380.0" y1="82" x2="380.0" y2="232" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="608.0" y="52" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="670.0" y="72" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">API</text>
<line x1="670.0" y1="82" x2="670.0" y2="232" stroke="#94a3b8" stroke-dasharray="4 4"/>
<line x1="90.0" y1="108" x2="374.0" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="144.4" y="91.0" width="181.1" height="15" fill="#ffffff"/><text x="235.0" y="102" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">1. Its own client credentials</text>
<line x1="380.0" y1="142" x2="96.0" y2="142" stroke="#047857" stroke-width="1.5" marker-end="url(#arg)"/>
<rect x="185.8" y="125.0" width="98.5" height="15" fill="#ffffff"/><text x="235.0" y="136" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">2. Access token</text>
<line x1="90.0" y1="176" x2="664.0" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="310.1" y="159.0" width="139.8" height="15" fill="#ffffff"/><text x="380.0" y="170" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">3. Call with the token</text>
<line x1="670.0" y1="210" x2="96.0" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="292.4" y="193.0" width="175.2" height="15" fill="#ffffff"/><text x="380.0" y="204" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">4. The agent's own resources</text>
<text x="24" y="290" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Three-legged (3LO): the agent acts for a user, with consent</text>
<rect x="28.0" y="302" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="90.0" y="322" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">User</text>
<line x1="90.0" y1="332" x2="90.0" y2="610" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="173.0" y="302" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="235.0" y="322" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Agent client app</text>
<line x1="235.0" y1="332" x2="235.0" y2="610" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="318.0" y="302" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="380.0" y="322" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Agent (ADK)</text>
<line x1="380.0" y1="332" x2="380.0" y2="610" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="463.0" y="302" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="525.0" y="322" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Authorization server</text>
<line x1="525.0" y1="332" x2="525.0" y2="610" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="608.0" y="302" width="124" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="670.0" y="322" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">API</text>
<line x1="670.0" y1="332" x2="670.0" y2="610" stroke="#94a3b8" stroke-dasharray="4 4"/>
<line x1="380.0" y1="358" x2="241.0" y2="358" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="208.1" y="341.0" width="198.8" height="15" fill="#ffffff"/><text x="307.5" y="352" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">1. Pause: adk_request_credential</text>
<line x1="235.0" y1="392" x2="96.0" y2="392" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="86.7" y="375.0" width="151.6" height="15" fill="#ffffff"/><text x="162.5" y="386" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">2. Open the consent page</text>
<line x1="90.0" y1="426" x2="519.0" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="160.9" y="409.0" width="293.2" height="15" fill="#ffffff"/><text x="307.5" y="420" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">3. Sign in and consent (password goes only here)</text>
<line x1="525.0" y1="460" x2="241.0" y2="460" stroke="#047857" stroke-width="1.5" marker-end="url(#arg)"/>
<rect x="262.9" y="443.0" width="234.2" height="15" fill="#ffffff"/><text x="380.0" y="454" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">4. Redirect with an authorization code</text>
<line x1="235.0" y1="494" x2="374.0" y2="494" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="214.0" y="477.0" width="187.0" height="15" fill="#ffffff"/><text x="307.5" y="488" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">5. Send the auth response back</text>
<line x1="380.0" y1="528" x2="519.0" y2="528" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="370.8" y="511.0" width="163.4" height="15" fill="#ffffff"/><text x="452.5" y="522" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">6. Exchange code for token</text>
<line x1="525.0" y1="562" x2="386.0" y2="562" stroke="#047857" stroke-width="1.5" marker-end="url(#arg)"/>
<rect x="356.1" y="545.0" width="192.9" height="15" fill="#ffffff"/><text x="452.5" y="556" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">7. Access token (user's scopes)</text>
<line x1="380.0" y1="596" x2="664.0" y2="596" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="410.9" y="579.0" width="228.3" height="15" fill="#ffffff"/><text x="525.0" y="590" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">8. Retry the tool call with the token</text>
</g></svg>
