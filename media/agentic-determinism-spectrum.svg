<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A spectrum from chatbot to workflow to agent, showing who controls the path and what each design gains and costs">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Who controls the path?</text>

  <!-- spectrum arrow -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="60" x2="700" y1="70" y2="70">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>
  <line x1="60" y1="70" x2="700" y2="70" stroke="url(#g)" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">
    <text x="60" y="94">Less system autonomy</text>
    <text x="700" y="94" text-anchor="end">More system autonomy</text>
  </g>

  <!-- three cards -->
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="112" width="210" height="196" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="145" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Chatbot</text>
    <text x="145" y="162" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="600">The user decides</text>
    <g font-size="12" fill="#334155">
      <text x="58" y="190">Answers each message</text>
      <text x="58" y="210">Acts only when asked</text>
      <text x="58" y="240" fill="#047857">+ Simple, low risk</text>
      <text x="58" y="260" fill="#b45309">− User directs each</text>
      <text x="58" y="280" fill="#b45309">   next step</text>
    </g>

    <rect x="275" y="112" width="210" height="196" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Workflow</text>
    <text x="380" y="162" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="600">The designer decides</text>
    <g font-size="12" fill="#334155">
      <text x="293" y="190">Paths laid out in advance</text>
      <text x="293" y="210">Models fill steps or branch</text>
      <text x="293" y="240" fill="#047857">+ Predictable, testable</text>
      <text x="293" y="260" fill="#b45309">− Breaks when the path</text>
      <text x="293" y="280" fill="#b45309">   can't be known ahead</text>
    </g>

    <rect x="510" y="112" width="210" height="196" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="615" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Agent</text>
    <text x="615" y="162" text-anchor="middle" font-size="12" fill="#047857" font-weight="600">The model decides</text>
    <g font-size="12" fill="#334155">
      <text x="528" y="190">Directs its own steps</text>
      <text x="528" y="210">and tool calls, in a loop</text>
      <text x="528" y="240" fill="#047857">+ Handles open-ended tasks</text>
      <text x="528" y="260" fill="#b45309">− Less predictable; needs</text>
      <text x="528" y="280" fill="#b45309">   evals and guardrails</text>
    </g>
  </g>
</svg>
