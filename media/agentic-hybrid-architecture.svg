<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A hybrid agent: a low-code front end in Gemini Enterprise calling code-built agents and tools">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="800" height="600" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a">A hybrid agent: low-code front end, code-built parts</text>
<rect x="320" y="44" width="160" height="36" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400" y="67" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Employees</text>
<polyline points="400,80 400,112" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="16" y="114" width="768" height="206" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="32" y="136" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Low-code: Gemini Enterprise</text>
<rect x="32" y="148" width="532" height="156" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="48" y="170" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">Workflow Builder workflow</text>
<rect x="48" y="188" width="156" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="126" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">MCP step</text>
<text x="126" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">calls an MCP server</text>
<rect x="222" y="188" width="156" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Existing-agent step</text>
<text x="300" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">calls an ADK agent</text>
<rect x="396" y="188" width="156" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="474" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Human approval</text>
<text x="474" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">a person signs off</text>
<polyline points="204,220 220,220" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="378,220 394,220" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="580" y="188" width="188" height="64" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="674" y="212" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">ADK agent, registered</text>
<text x="674" y="231" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">needed for the step;</text>
<text x="674" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">users open it directly</text>
<rect x="16" y="348" width="768" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="370" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f766e">Code-built: your project</text>
<rect x="40" y="384" width="232" height="48" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="156" y="404" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">MCP server on Cloud Run</text>
<text x="156" y="422" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">exposes pricing as tools</text>
<rect x="40" y="446" width="232" height="40" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="156" y="471" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Internal pricing API</text>
<polyline points="156,432 156,445" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="440" y="384" width="300" height="64" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="590" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">ADK agent on Agent Runtime</text>
<text x="590" y="430" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155">its own tools and a large model</text>
<polyline points="126,252 126,383" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="300,252 300,334 520,334 520,383" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="674,252 674,383" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="16" y="516" width="768" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="400" y="542" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#92400e">Decide early where identity, evaluation and Model Armor screening live for each part:</text>
<text x="400" y="564" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#92400e">those are what a later migration breaks.</text>
</svg>
