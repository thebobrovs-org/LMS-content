<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Anatomy of one ADK eval case. The case has an id and a session input (app name, user id, initial state). Each turn holds the user's input, the expected tool trajectory, any expected intermediate responses, and the expected final response. Criteria in the eval config decide how each part is scored: a trajectory criterion for the tool calls, a response criterion for the final response, and optional rubrics when no single reference answer exists.">
  <rect width="760" height="400" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Anatomy of an eval case</text>

    <rect x="30" y="48" width="460" height="330" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="48" y="74" font-size="13" font-weight="600" fill="#0f172a">eval case  <tspan font-weight="400" fill="#475569">eval_id: refund-damaged-under-limit</tspan></text>
    <text x="48" y="96" font-size="12" fill="#475569">Session input: app name, user id, initial state (e.g. customer tier)</text>

    <rect x="48" y="110" width="424" height="252" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="64" y="132" font-size="12" font-weight="600" fill="#334155">Turn 1 (one per user message)</text>

    <g font-size="12">
      <rect x="64" y="144" width="392" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="76" y="161" font-weight="600" fill="#1e3a8a">User input</text>
      <text x="76" y="177" fill="#334155">"Order 1182 arrived broken. Can I get my $60 back?"</text>

      <rect x="64" y="192" width="392" height="56" rx="8" fill="#ecfdf5" stroke="#10b981"/>
      <text x="76" y="209" font-weight="600" fill="#065f46">Expected trajectory (tool calls, in order)</text>
      <text x="76" y="226" fill="#334155">get_order(order_id="1182")</text>
      <text x="76" y="241" fill="#334155">issue_refund(order_id="1182", amount=60)</text>

      <rect x="64" y="256" width="392" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="76" y="273" font-weight="600" fill="#334155">Expected intermediate responses</text>
      <text x="76" y="289" fill="#64748b">(sub-agent messages; often empty for one agent)</text>

      <rect x="64" y="304" width="392" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="76" y="321" font-weight="600" fill="#1e3a8a">Expected final response</text>
      <text x="76" y="338" fill="#334155">"I've refunded $60 for order 1182."</text>
    </g>

    <!-- criteria column -->
    <rect x="520" y="48" width="210" height="330" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="625" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Eval config: how to score</text>
    <g font-size="12" fill="#334155">
      <text x="536" y="214" font-weight="600" fill="#065f46">Trajectory criterion</text>
      <text x="536" y="231">compares actual tool calls</text>
      <text x="536" y="246">with the expected ones</text>
      <text x="536" y="314" font-weight="600" fill="#1e3a8a">Response criterion</text>
      <text x="536" y="331">compares the final reply</text>
      <text x="536" y="346">with the reference</text>
      <text x="536" y="110" font-weight="600" fill="#92400e">Rubrics (optional)</text>
      <text x="536" y="127">yes/no checks an LLM judge</text>
      <text x="536" y="142">applies when no single</text>
      <text x="536" y="157">reference answer exists</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
      <line x1="456" y1="220" x2="530" y2="220"/>
      <line x1="456" y1="326" x2="530" y2="326"/>
    </g>
  </g>
</svg>
