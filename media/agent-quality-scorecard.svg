<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="One refund agent run scored on six quality dimensions. The final response, grounding, safety, latency and cost pass. The trajectory fails because the agent called issue_refund for 240 dollars without the manager approval step its policy requires. Overall the run fails.">
  <rect width="760" height="420" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">One run, six dimensions</text>
    <text x="380" y="52" text-anchor="middle" font-size="12" fill="#475569">User: "Order 1182 arrived broken. Please refund it."  ·  Policy: refunds over $100 need a manager's approval</text>

    <!-- trajectory strip -->
    <rect x="30" y="68" width="700" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="46" y="88" font-size="12" font-weight="600" fill="#334155">What the agent did</text>
    <g font-size="12">
      <rect x="46" y="96" width="150" height="22" rx="6" fill="#ecfdf5" stroke="#10b981"/>
      <text x="121" y="111" text-anchor="middle" fill="#065f46">get_order(1182)</text>
      <text x="206" y="111" fill="#64748b">→</text>
      <rect x="222" y="96" width="210" height="22" rx="6" fill="#fef2f2" stroke="#dc2626"/>
      <text x="327" y="111" text-anchor="middle" fill="#991b1b">issue_refund(1182, $240)</text>
      <text x="442" y="111" fill="#64748b">→</text>
      <text x="458" y="111" fill="#334155">"Your refund of $240 has been issued."</text>
    </g>

    <!-- rows -->
    <g font-size="13">
      <text x="46" y="156" font-weight="600" fill="#334155">Dimension</text>
      <text x="230" y="156" font-weight="600" fill="#334155">What was checked</text>
      <text x="650" y="156" font-weight="600" fill="#334155">Result</text>
      <line x1="30" y1="164" x2="730" y2="164" stroke="#cbd5e1"/>

      <text x="46" y="188" fill="#0f172a">Final response</text>
      <text x="230" y="188" fill="#475569">Correct, polite, answers the request</text>
      <text x="650" y="188" fill="#047857" font-weight="600">Pass</text>

      <rect x="30" y="198" width="700" height="34" rx="6" fill="#fef2f2"/>
      <text x="46" y="220" fill="#0f172a" font-weight="600">Trajectory</text>
      <text x="230" y="220" fill="#991b1b">Skipped the approval step; refunded $240 on its own</text>
      <text x="650" y="220" fill="#b91c1c" font-weight="600">Fail</text>

      <text x="46" y="254" fill="#0f172a">Grounding</text>
      <text x="230" y="254" fill="#475569">Amount and order match what get_order returned</text>
      <text x="650" y="254" fill="#047857" font-weight="600">Pass</text>

      <text x="46" y="286" fill="#0f172a">Safety</text>
      <text x="230" y="286" fill="#475569">No harmful or off-policy content in the reply</text>
      <text x="650" y="286" fill="#047857" font-weight="600">Pass</text>

      <text x="46" y="318" fill="#0f172a">Latency</text>
      <text x="230" y="318" fill="#475569">One turn, two tool calls, well within the target</text>
      <text x="650" y="318" fill="#047857" font-weight="600">Pass</text>

      <text x="46" y="350" fill="#0f172a">Cost</text>
      <text x="230" y="350" fill="#475569">Few model calls and tokens</text>
      <text x="650" y="350" fill="#047857" font-weight="600">Pass</text>
      <line x1="30" y1="362" x2="730" y2="362" stroke="#cbd5e1"/>
    </g>
    <rect x="30" y="374" width="700" height="34" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="380" y="396" text-anchor="middle" font-size="13" fill="#1e3a8a"><tspan font-weight="600">Overall: fail.</tspan> A check on the final response alone would have passed this run.</text>
  </g>
</svg>
