<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Trace waterfall of one agent turn: 13.6 seconds against a 4 second target, with a reasoning loop of four identical search_flights calls (A) and a 6.6 second get_fare_rules call (B).">
  <rect width="760" height="520" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">One slow turn, as a trace</text>
    <text x="380" y="48" text-anchor="middle" font-size="12" fill="#475569">User: "Move my Tuesday flight to Friday."  Target: under 4 s per turn</text>
    <line x1="250.0" y1="70" x2="250.0" y2="430" stroke="#cbd5e1"/><text x="250.0" y="66" font-size="11" fill="#64748b" text-anchor="middle">0 s</text><line x1="318.6" y1="70" x2="318.6" y2="430" stroke="#cbd5e1"/><text x="318.6" y="66" font-size="11" fill="#64748b" text-anchor="middle">2 s</text><line x1="387.1" y1="70" x2="387.1" y2="430" stroke="#cbd5e1"/><text x="387.1" y="66" font-size="11" fill="#64748b" text-anchor="middle">4 s</text><line x1="455.7" y1="70" x2="455.7" y2="430" stroke="#cbd5e1"/><text x="455.7" y="66" font-size="11" fill="#64748b" text-anchor="middle">6 s</text><line x1="524.3" y1="70" x2="524.3" y2="430" stroke="#cbd5e1"/><text x="524.3" y="66" font-size="11" fill="#64748b" text-anchor="middle">8 s</text><line x1="592.9" y1="70" x2="592.9" y2="430" stroke="#cbd5e1"/><text x="592.9" y="66" font-size="11" fill="#64748b" text-anchor="middle">10 s</text><line x1="661.4" y1="70" x2="661.4" y2="430" stroke="#cbd5e1"/><text x="661.4" y="66" font-size="11" fill="#64748b" text-anchor="middle">12 s</text><line x1="730.0" y1="70" x2="730.0" y2="430" stroke="#cbd5e1"/><text x="730.0" y="66" font-size="11" fill="#64748b" text-anchor="middle">14 s</text>
    <line x1="387.1" y1="86" x2="387.1" y2="118" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="391" y="84" font-size="11" fill="#b91c1c">4 s target</text>
    <path d="M474,150 L480,150 L480,336 L474,336" fill="none" stroke="#92400e" stroke-width="1.5"/>
    <text x="488" y="247" font-size="13" font-weight="700" fill="#92400e">A</text>
    <text x="712" y="388" font-size="13" font-weight="700" fill="#991b1b">B</text>
    <text x="24" y="107" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">invoke_agent travel_agent</text><rect x="250.0" y="92" width="466.3" height="22" rx="4" fill="#e2e8f0" stroke="#475569"/><text x="256.0" y="107" font-size="11" fill="#0f172a">13.6 s</text><text x="38" y="135" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">generate_content gemini</text><rect x="250.0" y="120" width="30.9" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="284.9" y="135" font-size="11" fill="#475569">0.9 s</text><text x="38" y="163" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">execute_tool search_flights</text><rect x="280.9" y="148" width="13.7" height="22" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="298.6" y="163" font-size="11" fill="#475569">0.4 s</text><text x="38" y="191" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">generate_content gemini</text><rect x="294.6" y="176" width="27.4" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="326.0" y="191" font-size="11" fill="#475569">0.8 s</text><text x="38" y="219" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">execute_tool search_flights</text><rect x="322.0" y="204" width="13.7" height="22" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="339.7" y="219" font-size="11" fill="#475569">0.4 s</text><text x="38" y="247" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">generate_content gemini</text><rect x="335.7" y="232" width="27.4" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="367.1" y="247" font-size="11" fill="#475569">0.8 s</text><text x="38" y="275" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">execute_tool search_flights</text><rect x="363.1" y="260" width="13.7" height="22" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="380.9" y="275" font-size="11" fill="#475569">0.4 s</text><text x="38" y="303" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">generate_content gemini</text><rect x="376.9" y="288" width="27.4" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="408.3" y="303" font-size="11" fill="#475569">0.8 s</text><text x="38" y="331" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">execute_tool search_flights</text><rect x="404.3" y="316" width="13.7" height="22" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="422.0" y="331" font-size="11" fill="#475569">0.4 s</text><text x="38" y="359" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">generate_content gemini</text><rect x="418.0" y="344" width="30.9" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="452.9" y="359" font-size="11" fill="#475569">0.9 s</text><text x="38" y="387" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">execute_tool get_fare_rules</text><rect x="448.9" y="372" width="226.3" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c"/><text x="679.1" y="387" font-size="11" fill="#475569">6.6 s</text><text x="38" y="415" font-size="12" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">generate_content gemini</text><rect x="675.1" y="400" width="41.1" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="720.3" y="415" font-size="11" fill="#475569">1.2 s</text>
    <g font-size="12">
      <rect x="24" y="436" width="340" height="52" rx="8" fill="#fffbeb" stroke="#b45309"/>
      <text x="36" y="456" font-weight="600" fill="#92400e">A: reasoning loop</text>
      <text x="36" y="474" fill="#334155">search_flights ×4, same arguments, no progress</text>
      <rect x="390" y="436" width="346" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
      <text x="402" y="456" font-weight="600" fill="#991b1b">B: slow tool</text>
      <text x="402" y="474" fill="#334155">get_fare_rules takes 6.6 s of the 13.6 s turn</text>
    </g>
  </g>
</svg>
