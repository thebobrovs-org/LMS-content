name: Bug
description: Something is broken
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Observed vs. expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, inputs or state → the wrong result. For code bugs, give file:line.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, links to code.
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Checkboxes. The Architect completes these in triage.
      value: |
        - [ ] Regression test that fails before the fix
        - [ ]
