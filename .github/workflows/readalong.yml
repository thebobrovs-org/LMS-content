# Read-along audio (scripts/generate-readalong.mjs): narrates lessons that hold a prop-less
# <ReadAlong /> with ElevenLabs, uploads the MP3s to the audio bucket and commits each lesson's
# cues as audio/<topic id>.json to the pull request, for review like any other change.
#
# When it runs:
# - the label "audio" on a pull request, and each push to it while the label is on: narrates the
#   lessons whose text, voice or model changed (an unchanged lesson costs nothing);
# - the label "audio-samples": reads one paragraph in each sample voice and attaches the MP3s to
#   the run as an artifact, to choose a voice by ear (nothing is committed or uploaded);
# - by hand (Actions → Read-along audio → Run workflow), either mode, on any branch.
#
# This repo is public, so the ElevenLabs key and the bucket are guarded:
# - never `pull_request_target`, and nothing runs for a fork's pull request (no secrets reach code
#   from outside); adding a label needs write access to the repository;
# - the bucket is written through Workload Identity Federation, with no key file: GCP trusts only
#   this workflow file in this repository (the provider's attribute condition), and the service
#   account may only create objects in the audio bucket;
# - the job's token may push to the pull request's branch and start CI there, nothing else; the
#   checkout keeps no credentials, so the install and the script never see the token.
#
# Settings it reads (Settings → Secrets and variables → Actions):
#   secret   ELEVENLABS_API_KEY
#   vars     AUDIO_BUCKET, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, and optionally READALONG_VOICE
#            (default Bella) and READALONG_MODEL (default eleven_multilingual_v2)
name: Read-along audio

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      mode:
        description: "lessons: narrate changed lessons and commit audio/*.json. samples: voice samples as an artifact."
        type: choice
        options: [lessons, samples]
        default: lessons
      force:
        description: "lessons: regenerate even when the audio is up to date"
        type: boolean
        default: false
      lesson:
        description: "samples: the lesson to read from"
        default: topics/math-infra/what-is-a-tensor.mdx
      voices:
        description: "samples: comma-separated ElevenLabs voice ids (default Bella, Alice, River)"
        default: hpp4J3VqNfWAUOO0d1Us,Xb7hH8MSUJpSbSDYk0k2,SAz9YHcvj6GT2YYXdXww

permissions: {}

concurrency:
  group: readalong-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  lessons:
    name: narrate lessons
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'lessons') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'audio') &&
       (github.event.action == 'synchronize' || github.event.label.name == 'audio'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit audio/*.json to the pull request's branch
      id-token: write # Workload Identity Federation → the bucket's service account
      actions: write # start CI on the new commit (a push by this token starts no workflow by itself)
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Say what would be narrated
        run: node scripts/generate-readalong.mjs --all --dry-run ${{ inputs.force && '--force' || '' }}
        env:
          READALONG_VOICE: ${{ vars.READALONG_VOICE }}
          READALONG_MODEL: ${{ vars.READALONG_MODEL }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Narrate
        run: node scripts/generate-readalong.mjs --all ${{ inputs.force && '--force' || '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AUDIO_BUCKET: ${{ vars.AUDIO_BUCKET }}
          READALONG_VOICE: ${{ vars.READALONG_VOICE }}
          READALONG_MODEL: ${{ vars.READALONG_MODEL }}
      - name: Commit the cues and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain -- audio)" ]; then
            echo "No audio changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node pipeline/validate.mjs --staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audio
          git commit -m "chore(audio): narrate lessons for <ReadAlong />"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          # CI runs from the default branch's copy of ci.yml; before that copy has workflow_dispatch, say so instead.
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH" \
            || echo "Couldn't start CI on the new commit; push to the branch, or re-run CI, to check it." >> "$GITHUB_STEP_SUMMARY"

  samples:
    name: voice samples
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'samples') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.action == 'labeled' && github.event.label.name == 'audio-samples')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Read one paragraph in each voice
        run: node scripts/generate-readalong.mjs --sample "$LESSON" --voices "$VOICES"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LESSON: ${{ inputs.lesson || 'topics/math-infra/what-is-a-tensor.mdx' }}
          VOICES: ${{ inputs.voices || 'hpp4J3VqNfWAUOO0d1Us,Xb7hH8MSUJpSbSDYk0k2,SAz9YHcvj6GT2YYXdXww' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-samples
          path: .readalong-out/samples/*.mp3
          retention-days: 14
