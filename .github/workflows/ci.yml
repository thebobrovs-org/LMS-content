# The CI gate (hyperstack AGREEMENT §4, gate G2). It runs the same `npm run gate`
# that `hyperstack/bin/pre-pr` runs locally. One job, first-party actions pinned
# by SHA, a read-only token, no secrets, and superseded runs cancelled.
# The job name `gate` is a required status check on main. Don't rename it.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run gate

  # After a merge: tell the app, so it builds main with this content and deploys it to
  # staging (LMS .github/workflows/deploy.yml, LMS#66). Production keeps serving the
  # content pinned in LMS/content.lock.json until a pin move merges there. The token is
  # the PO's (hyperstack docs/runbooks/deploy-pipeline-setup.md, step 4); without it,
  # this job only says so.
  content-merged:
    name: tell the app (staging deploy)
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.LMS_DISPATCH_TOKEN }}
    steps:
      - name: repository_dispatch content-merged → thebobrovs-org/LMS
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::LMS_DISPATCH_TOKEN is not set, so the app wasn't told. To see this content on staging: gh workflow run deploy.yml -R thebobrovs-org/LMS -f content_ref=$GITHUB_SHA"
            exit 0
          fi
          gh api "repos/thebobrovs-org/LMS/dispatches" -f event_type=content-merged -f "client_payload[content_sha]=$GITHUB_SHA"
          echo "told LMS: content-merged $GITHUB_SHA"
